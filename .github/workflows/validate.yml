name: Validate Sigma Rules
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned sigma-cli and Splunk backend
        run: |
          pipx install sigma-cli==4.0.0
          pipx inject sigma-cli pysigma-backend-splunk==3.0.0
      - name: Show installed Sigma packages
        run: pipx runpip sigma-cli list | grep -i sigma
      - name: Validate rules (quality gate)
        run: sigma check --fail-on-error --fail-on-issues rules/
      - name: Convert rules to Splunk queries
        run: sigma convert -t splunk -p splunk_windows rules/
