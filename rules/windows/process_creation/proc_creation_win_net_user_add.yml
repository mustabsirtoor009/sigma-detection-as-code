title: Local User Account Created With Net Command
id: fc9ae912-6ddd-434f-b9a0-9cec4406de81
status: experimental
description: Detects creation of a local user account with net.exe or net1.exe. Attackers create local accounts to keep access to a system.
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: mustabsirtoor009
date: 2026-11-11
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_cli:
        CommandLine|contains|all:
            - ' user '
            - ' /add'
    condition: selection_img and selection_cli
falsepositives:
    - Administrators and provisioning scripts that create local accounts
level: medium
