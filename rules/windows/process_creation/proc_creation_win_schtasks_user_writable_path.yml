title: Scheduled Task Created With User-Writable Path
id: f617f359-e592-44c8-b8f6-258a527a76f9
status: experimental
description: Detects creation of a scheduled task with schtasks.exe whose command line references a user-writable location such as AppData, Temp, or the Public folder. Attackers use scheduled tasks for persistence.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: mustabsirtoor009
date: 2026-11-11
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_create:
        CommandLine|contains:
            - ' /create '
            - ' -create '
    selection_path:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
    condition: selection_img and selection_create and selection_path
falsepositives:
    - Software installers and updaters that register tasks from AppData, such as browser or chat client updaters
level: medium
